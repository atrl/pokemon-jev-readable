name: Planner repair validation
on:
  push:
    branches: [fix/system-two-plan-lifecycle]
    paths: ['.maintenance/**', '.github/workflows/planner-repair.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply reviewed exact-hash source changes
        run: |
          mkdir -p pokemon-evidence/repair
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.').resolve()
          manifest=json.loads(pathlib.Path('.maintenance/final-hashes.json').read_text())
          for source in ('campaign-edits.json','run-edits.json','other-edits.json'):
              entries=json.loads((root/'.maintenance'/source).read_text())
              for name,entry in entries.items():
                  assert name in manifest and not pathlib.Path(name).is_absolute() and '..' not in pathlib.Path(name).parts
                  path=root/name
                  raw=path.read_bytes()
                  assert hashlib.sha256(raw).hexdigest()==entry['before'],('base_changed',name)
                  lines=raw.decode().splitlines(True)
                  for start,end,text in reversed(entry['edits']):
                      assert 0<=start<=end<=len(lines)
                      lines[start:end]=[text] if text else []
                  result=''.join(lines).encode()
                  assert hashlib.sha256(result).hexdigest()==entry['after'],('patch_mismatch',name)
                  path.write_bytes(result)
          actual={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in manifest}
          wrong=[name for name in manifest if actual[name]!=manifest[name]]
          pathlib.Path('pokemon-evidence/repair/source-hashes.json').write_text(json.dumps({'expected':manifest,'actual':actual,'mismatches':wrong},indent=2))
          assert not wrong,('transferred_source_mismatch',wrong)
          pathlib.Path('/tmp/repair-source-paths.json').write_text(json.dumps(list(manifest)))
          print('All 21 source files match the locally tested SHA256 manifest.')
          PY
      - name: Install actual emulator
        run: |
          python3 -m venv /tmp/redstar-venv
          /tmp/redstar-venv/bin/pip install -r pokemon/requirements.txt
      - name: Python and frontend regression tests
        run: |
          set -o pipefail
          /tmp/redstar-venv/bin/python -m unittest discover -s pokemon/tests -v 2>&1 | tee pokemon-evidence/repair/python-tests.txt
          npm run check 2>&1 | tee pokemon-evidence/repair/node-check.txt
          npm test 2>&1 | tee pokemon-evidence/repair/node-tests.txt
      - name: Actual ROM memory regression (scripted fixture, not AI gameplay)
        run: /tmp/redstar-venv/bin/python pokemon/test_live.py
      - name: Commit only the reviewed source changes to the repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          paths=json.loads(pathlib.Path('/tmp/repair-source-paths.json').read_text())
          # Workflow writes are performed separately through the authorized connector.
          paths=[name for name in paths if not name.startswith('.github/')]
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','rm','-r','--','.maintenance'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pokemon): implement grounded System Two plans and verified lifecycle'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/system-two-plan-lifecycle
          git rev-parse HEAD > pokemon-evidence/repair/tested-source-commit.txt
      - name: Real dual-model run (80 actions, four planner requests, no substitute policy)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          DEEPSEEK_THINKING: ${{ vars.DEEPSEEK_THINKING || 'disabled' }}
        run: /tmp/redstar-venv/bin/python pokemon/test_dual_live.py --steps 80
      - name: Source-only archive for independent comparison
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,zipfile
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('pokemon-evidence/repair/reviewed-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p=pathlib.Path(name)
                  if p.is_file() and p.suffix in {'.py','.json','.md','.txt','.mjs','.js','.html','.css','.yml','.toml'} and not name.startswith('.maintenance/'):
                      z.write(p,name)
          PY
      - name: Upload test reports and replay only, never ROMs or save-states
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: planner-repair-evidence-${{ github.run_id }}
          path: |
            pokemon-evidence/**/*.json
            pokemon-evidence/**/*.jsonl
            pokemon-evidence/**/*.png
            pokemon-evidence/**/*.txt
            pokemon-evidence/**/*.zip
            pokemon-evidence/**/*.html
            pokemon-evidence/**/*.gif
            pokemon-evidence/**/*.md
          retention-days: 7
          if-no-files-found: error
