name: Layout repair verification
on:
  push:
    branches: [fix/restore-assets-and-organize-layout]
    paths: ['.github/workflows/layout-review.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Restore original assets and apply exact verified source tree
        run: |
          python3 - <<'PYAPPLY'
          import base64, gzip, hashlib, json, pathlib, shutil, subprocess
          root = pathlib.Path.cwd().resolve()
          parts = root / '.github/layout-parts'
          encoded = ''.join((parts / f'{i:02d}').read_text(encoding='utf-8') for i in range(13))
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '13202da3359cc743a0779193ed3b762678a9a36c009631172d3bc22390526be2', 'Payload hash mismatch'
          delta = json.loads(raw)
          subprocess.run(['git','merge-base','--is-ancestor',delta['base'],'HEAD'], check=True)
          def path(name):
              p = pathlib.PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts or '.git' in p.parts:
                  raise ValueError('Invalid destination path')
              dest = (root / p).resolve()
              if not dest.is_relative_to(root):
                  raise ValueError('Destination escaped repository')
              return dest
          def digest(content):
              return hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
          writes = []
          for row in delta['files']:
              old = subprocess.check_output(['git','cat-file','blob',row['source_blob']]).decode('utf-8') if row['source_blob'] else ''
              end_limit = len(old)
              for start, end, replacement in reversed(row['edits']):
                  assert type(start) is int and type(end) is int and 0 <= start <= end <= end_limit
                  old = old[:start] + replacement + old[end:]
                  end_limit = start
              content = old.encode('utf-8')
              assert digest(content) == row['expected_blob'], 'Result hash mismatch: '+row['path']
              writes.append((path(row['path']),content))
          assets = []
          for row in delta['restore_assets']:
              content = subprocess.check_output(['git','cat-file','blob',row['blob']])
              assert digest(content) == row['blob']
              writes.append((path(row['path']),content))
              assets.append({'path':row['path'],'git_blob':digest(content),'size':len(content),'sha1':hashlib.sha1(content).hexdigest()})
          for name in delta['delete']:
              dest = path(name)
              assert dest.is_file(), 'Missing migration source: '+name
          for dest, content in writes:
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(content)
          for name in delta['delete']:
              path(name).unlink()
          for directory in ('pokemon/tests', 'pokemon/prompts'):
              path(directory).rmdir()
          shutil.rmtree(parts)
          path('.github/workflows/layout-review.yml').unlink()
          path('.github/layout-0.b64').unlink(missing_ok=True)
          subprocess.run(['git','add','-A'], check=True)
          actual = subprocess.check_output(['git','write-tree'],text=True).strip()
          assert actual == delta['expected_tree'], ('Unexpected complete tree',actual)
          out = pathlib.Path('/tmp/layout-verification')
          out.mkdir(exist_ok=True)
          (out/'source.json').write_text(json.dumps({'tree':actual,'source_hashes_verified':True,'source_files':len(delta['files']),'restored_assets':assets,'models_called':False}, indent=2)+'\n')
          print('Verified exact final tree:',actual)
          print('Original assets restored byte-for-byte:',len(assets))
          PYAPPLY
      - name: Install real emulator
        run: |
          python3 -m venv /tmp/layout-venv
          /tmp/layout-venv/bin/pip install -r pokemon/requirements.txt
      - name: Core regressions from unified test directories
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/layout-verification/syntax.log
          npm test 2>&1 | tee /tmp/layout-verification/node.log
          /tmp/layout-venv/bin/python -m unittest discover -s tests/python -v 2>&1 | tee /tmp/layout-verification/python.log
      - name: Actual ROM scripted regression, no model request
        run: |
          set -o pipefail
          /tmp/layout-venv/bin/python tests/integration/test_rom.py 2>&1 | tee /tmp/layout-verification/rom.log
          /tmp/layout-venv/bin/python -m unittest discover -s tests/integration -v 2>&1 | tee /tmp/layout-verification/integration.log
      - name: Commit only the verified clean tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git write-tree)" = '84d6d05f393be6bf2d6b758ae5f91d173fc145d3'
          git diff --exit-code
          gh auth setup-git
          test "$(git ls-remote origin refs/heads/fix/restore-assets-and-organize-layout | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: restore original assets and unify tests, data and model prompts'
          git push origin HEAD:refs/heads/fix/restore-assets-and-organize-layout
          git rev-parse HEAD > /tmp/layout-verification/tested-commit.txt
      - name: Preserve reports only outside Git
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layout-verification-${{ github.run_id }}
          path: |
            /tmp/layout-verification/
            outputs/tests/rom/*.json
            outputs/tests/rom/*.png
          retention-days: 7
          if-no-files-found: warn
