name: Organize Pokemon branches and recover last replay
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pokemon-organize.yml']
permissions:
  contents: read
jobs:
  organize:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test reporting changes
        run: python3 -m unittest discover -s pokemon/tests -v
      - name: Recover the user's actual 12-decision run (no model call)
        run: |
          python3 -m venv /tmp/replay-venv
          /tmp/replay-venv/bin/pip install 'Pillow>=10,<13'
          gh run download 35681979746 --repo "$GITHUB_REPOSITORY" --name redstar-memory-and-jev --dir /tmp/old-pokemon-run
          /tmp/replay-venv/bin/python pokemon/render_results.py --input /tmp/old-pokemon-run \
            --output recovered-replay --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/35681979746"
      - name: Publish the original run's GIF and interactive replay
        run: python3 pokemon/maintenance/publish_result.py --folder recovered-replay --run-id 35681979746 --attempt 1
      - name: Archive and remove only exact, merged branch heads
        run: python3 pokemon/maintenance/organize_branches.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pokemon-recovered-replay
          path: recovered-replay/
          retention-days: 30
          if-no-files-found: warn
