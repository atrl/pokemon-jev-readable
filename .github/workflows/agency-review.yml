name: Model agency validation
on:
  push:
    branches: [feat/observed-memory-model-agency]
    paths: ['.github/workflows/agency-review.yml', '.github/agency-parts/**']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply reviewed source delta with exact before and after hashes
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          encoded = ''.join((root/'.github/agency-parts'/f'{i:02d}').read_text() for i in range(6))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '6f61f6442f635e0149b42ba372d924622fcc3a308aa7b74cba2de5a84a5f00ad'
          delta = json.loads(raw)
          subprocess.run(['git','merge-base','--is-ancestor',delta['base'],'HEAD'],check=True)
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          writes = []
          for row in delta['files']:
              p = pathlib.PurePosixPath(row['path'])
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              assert p.parts[0] in ('pokemon','prompts','tests','docs') or str(p) == 'README.md'
              file = root / p
              data = file.read_bytes() if file.exists() else None
              assert (blob(data) if data is not None else None) == row['old'], str(p)
              text = data.decode('utf-8') if data is not None else ''
              limit = len(text)
              for start, end, replacement in reversed(row['edits']):
                  assert 0 <= start <= end <= limit
                  text = text[:start]+replacement+text[end:]
                  limit = start
              data = text.encode('utf-8')
              assert blob(data) == row['new'], str(p)
              writes.append((file,data))
          for file,data in writes:
              file.parent.mkdir(parents=True,exist_ok=True)
              file.write_bytes(data)
          paths = [r['path'] for r in delta['files']]
          subprocess.run(['git','add','--',*paths],check=True)
          out = pathlib.Path('/tmp/agency-validation'); out.mkdir(exist_ok=True)
          (out/'source.json').write_text(json.dumps({'source_hashes_verified':True,'files':{r['path']:r['new'] for r in delta['files']},'base':delta['base']},indent=2)+'\n')
          (out/'reviewed-paths.json').write_text(json.dumps(paths))
          print('Exact source hashes verified:',len(paths),'files; assets untouched')
          PY
      - name: Install actual emulator
        run: |
          python3 -m venv /tmp/agency-venv
          /tmp/agency-venv/bin/pip install -r pokemon/requirements.txt
      - name: Full regression including noninterference and model-agency tests
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/agency-validation/syntax.log
          npm test 2>&1 | tee /tmp/agency-validation/node.log
          /tmp/agency-venv/bin/python -m unittest discover -s tests/python -v 2>&1 | tee /tmp/agency-validation/python.log
      - name: Real ROM movement, observation boundary and memory roundtrip (scripted, not AI progress)
        run: |
          set -o pipefail
          /tmp/agency-venv/bin/python tests/integration/test_rom.py 2>&1 | tee /tmp/agency-validation/rom.log
      - name: Commit only reviewed runtime and test sources to this isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code
          gh auth setup-git
          test "$(git ls-remote origin refs/heads/feat/observed-memory-model-agency | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: make observations and experience neutral; models own game strategy'
          git push origin HEAD:refs/heads/feat/observed-memory-model-agency
          git rev-parse HEAD > /tmp/agency-validation/tested-commit.txt
      - name: Bounded authenticated dual-model attempt (12 decisions, no substitute policy)
        continue-on-error: true
        timeout-minutes: 6
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          DEEPSEEK_THINKING: ${{ vars.DEEPSEEK_THINKING || 'disabled' }}
        run: |
          set -o pipefail
          /tmp/agency-venv/bin/python tests/integration/test_dual_models.py --allow-model-calls --steps 12 2>&1 | tee /tmp/agency-validation/dual.log
      - name: Package source-only verification copy
        if: always()
        run: |
          git archive --format=tar HEAD README.md docs live package.json pokemon prompts pyproject.toml tests | gzip > /tmp/agency-validation/tested-source.tar.gz
      - name: Upload reports and screenshots only (never ROMs, credentials or save-states)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agency-validation-${{ github.run_id }}
          path: |
            /tmp/agency-validation/
            outputs/tests/rom/*.json
            outputs/tests/rom/*.png
            outputs/tests/dual/**/*.json
            outputs/tests/dual/**/*.jsonl
            outputs/tests/dual/**/*.png
            outputs/tests/dual/index.html
            outputs/tests/dual/README.md
            outputs/tests/dual/replay.gif
          retention-days: 7
          if-no-files-found: error
