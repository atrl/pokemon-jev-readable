name: Pokemon FireRed reference data
on:
  push:
    branches: [test/pokemon-firered]
    paths: ['.github/workflows/pokemon-firered-reference.yml']
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Fetch public source references only
        run: |
          python - <<'PY'
          import urllib.request, pathlib, hashlib, json
          out=pathlib.Path('references');out.mkdir()
          files={
            'pokefirered.sym': 'https://raw.githubusercontent.com/40Cakes/pokebot-gen3/main/modules/data/symbols/pokefirered.sym',
            'global.h': 'https://raw.githubusercontent.com/pret/pokefirered/master/include/global.h',
            'pokemon.h': 'https://raw.githubusercontent.com/pret/pokefirered/master/include/pokemon.h',
            'pokemon.c': 'https://raw.githubusercontent.com/pret/pokefirered/master/src/pokemon.c',
            'fieldmap.h': 'https://raw.githubusercontent.com/pret/pokefirered/master/include/fieldmap.h',
            'text.h': 'https://raw.githubusercontent.com/pret/pokefirered/master/include/text.h',
            'text.c': 'https://raw.githubusercontent.com/pret/pokefirered/master/src/text.c',
            'charmap.txt': 'https://raw.githubusercontent.com/pret/pokefirered/master/charmap.txt',
            'map_groups.json': 'https://raw.githubusercontent.com/pret/pokefirered/master/data/maps/map_groups.json',
            'flags.h': 'https://raw.githubusercontent.com/pret/pokefirered/master/include/constants/flags.h',
            'event_object_movement.h': 'https://raw.githubusercontent.com/pret/pokefirered/master/include/event_object_movement.h',
            'battle.h': 'https://raw.githubusercontent.com/pret/pokefirered/master/include/battle.h',
            'gen3-LICENSE': 'https://raw.githubusercontent.com/40Cakes/pokebot-gen3/main/LICENSE',
          }
          manifest={}
          for name,url in files.items():
            try:
              data=urllib.request.urlopen(url,timeout=30).read()
              (out/name).write_bytes(data)
              manifest[name]={'url':url,'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)}
              print(name, len(data))
            except Exception as exc:
              manifest[name]={'error':str(exc)}
              print(name,type(exc).__name__)
          symbols=(out/'pokefirered.sym').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(symbols)).encode()+b'\0'+symbols).hexdigest()=='5377ee48ca773d012000302545b477c936f40d46'
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: firered-reference-data
          path: references
          retention-days: 1
          if-no-files-found: error
