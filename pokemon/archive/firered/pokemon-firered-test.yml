name: Pokemon FireRed verification
on:
  push:
    branches: [test/pokemon-firered]
    paths:
      - '.github/workflows/pokemon-firered-test.yml'
      - 'pokemon-firered/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build pinned mGBA libretro core
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 0.10.5 https://github.com/mgba-emu/mgba.git "$RUNNER_TEMP/mgba"
          test "$(git -C "$RUNNER_TEMP/mgba" rev-parse HEAD)" = 26b7884bc25a5933960f3cdcd98bac1ae14d42e2
          cmake -S "$RUNNER_TEMP/mgba" -B "$RUNNER_TEMP/mgba-build" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_LIBRETRO=ON -DSKIP_LIBRARY=ON \
            -DBUILD_QT=OFF -DBUILD_SDL=OFF -DBUILD_PYTHON=OFF -DBUILD_LTO=OFF \
            -DM_CORE_GB=OFF -DDISABLE_DEPS=ON -DUSE_FFMPEG=OFF -DENABLE_SCRIPTING=OFF
          cmake --build "$RUNNER_TEMP/mgba-build" --parallel 2
          mkdir -p "$RUNNER_TEMP/pokemon-runtime"
          find "$RUNNER_TEMP/mgba-build" -name '*libretro*.so' -exec cp {} "$RUNNER_TEMP/pokemon-runtime/mgba_libretro.so" \;
          test -s "$RUNNER_TEMP/pokemon-runtime/mgba_libretro.so"
          cp "$RUNNER_TEMP/mgba/src/platform/libretro/libretro.h" "$RUNNER_TEMP/pokemon-runtime/"
          cp "$RUNNER_TEMP/mgba/src/platform/libretro/libretro.c" "$RUNNER_TEMP/pokemon-runtime/"
          cp "$RUNNER_TEMP/mgba/LICENSE" "$RUNNER_TEMP/pokemon-runtime/MGBA-LICENSE"
          ldd "$RUNNER_TEMP/pokemon-runtime/mgba_libretro.so"
      - name: Validate user-supplied ROM without changing it
        env:
          DEST: ${{ runner.temp }}/pokemon-runtime
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil
          path = pathlib.Path('1636 - Pokemon Fire Red (U)(Squirrels).gba')
          data = path.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert len(data) == 16777216
          assert blob == 'a0d042c360c18b860da3ef71ebac0d826e136cdc'
          info = {'source': 'user-provided repository file', 'bytes': len(data), 'git_blob': blob,
                  'sha1': hashlib.sha1(data).hexdigest(), 'sha256': hashlib.sha256(data).hexdigest(),
                  'title': data[0xa0:0xac].decode('ascii'), 'game_code': data[0xac:0xb0].decode('ascii'),
                  'revision': data[0xbc], 'header_checksum_valid': ((-sum(data[0xa0:0xbd])-0x19)&255)==data[0xbd],
                  'mgba_commit': '26b7884bc25a5933960f3cdcd98bac1ae14d42e2', 'emulation_test': 'not yet run'}
          assert info['game_code'] == 'BPRE'
          print(json.dumps(info, indent=2))
          dest = pathlib.Path(os.environ['DEST'])
          (dest/'rom-identity.json').write_text(json.dumps(info, indent=2))
          # Temporary private test artifact; not published or included in source distributions.
          shutil.copyfile(path, dest/'firered.gba')
          PY
      - name: Upload private temporary test runtime
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-firered-private-runtime
          path: ${{ runner.temp }}/pokemon-runtime
          retention-days: 1
          if-no-files-found: error
