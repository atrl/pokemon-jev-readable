<script>
"use strict";
const data=JSON.parse(document.getElementById("trace").textContent), steps=data.steps, s=data.summary;
const $=id=>document.getElementById(id);let index=0,timer=null;
const statusNames={budget_reached:"达到决策预算，已停止（非通关）",failed:"运行失败",blocked_missing_key:"未配置密钥，未执行 Jev",not_run:"Jev 未运行：本次可能只执行了回归测试",interrupted:"用户中断"};
$("status").textContent=statusNames[s.status]||s.status;$("source").textContent=s.source_run||"本地运行记录";
for(const [label,value] of [["Jev 调用",s.reported_jev_calls],["执行动作",s.reported_executed_actions],["坐标变化",s.position_changes],["不同位置",s.distinct_positions]]){const box=document.createElement("div");box.className="metric";const strong=document.createElement("strong");strong.textContent=value;box.append(strong,document.createTextNode(label));$("metrics").append(box)}
const message=[s.warning,s.reason].filter(Boolean).join(" ");if(message){$("warning").hidden=false;$("warning").textContent=message}
const count=steps.length+(data.last_image?1:0);$("slider").max=Math.max(0,count-1);$("slider").disabled=count<2;
function fmt(p){return p?`地图 ${p.map_id} · (${p.x}, ${p.y})`:"未读取到位置"}
function render(){const row=steps[index],last=!row;$("frame-title").textContent=last?"最终画面":"决策前画面";const image=last?data.last_image:row.image;$("screen").hidden=!image;$("no-screen").hidden=!!image;if(image)$("screen").src=image;$("counter").textContent=count?`${index+1} / ${count}`:"0 / 0";$("slider").value=index;$("prev").disabled=index<=0;$("next").disabled=index>=count-1;$("play").disabled=count<2;$("action").textContent=last?"本次运行结束":`步骤 ${row.step+1} · ${String(row.button).toUpperCase()}`;$("latency").textContent=last?"任务完成状态：未独立验证":`${row.model||"未知模型"} · 模型请求 ${row.latency_ms??"?"} ms · ${row.executed?"已执行":"未确认执行"}`;$("position").textContent=fmt(last?s.end_position:row.before);$("text").textContent=(last?data.last_text:row.text_before).join("\n")||"（没有可解码文字；不等于空白画面）";$("after").textContent=last?"":fmt(row.after)+"\n"+row.text_after.join("\n");$("raw").textContent=last?JSON.stringify(s,null,2):JSON.stringify(row.request,null,2);$("probabilities").replaceChildren();if(row)for(const [key,value] of Object.entries(row.probabilities).sort((a,b)=>b[1]-a[1])){const el=document.createElement("div");el.className="bar"+(key===row.button?" selected":"");const label=document.createElement("span");label.textContent=key;const track=document.createElement("div");track.className="track";const fill=document.createElement("div");fill.className="fill";fill.style.width=(100*Math.max(0,Math.min(1,Number(value))))+"%";track.append(fill);const number=document.createElement("span");number.textContent=(100*value).toFixed(1)+"%";el.append(label,track,number);$("probabilities").append(el)}}
function stop(){clearInterval(timer);timer=null;$("play").textContent="播放"}
$("prev").onclick=()=>{stop();index=Math.max(0,index-1);render()};$("next").onclick=()=>{stop();index=Math.min(count-1,index+1);render()};$("slider").oninput=e=>{stop();index=Number(e.target.value);render()};$("play").onclick=()=>{if(timer){stop();return}if(index>=count-1)index=0;render();$("play").textContent="暂停";timer=setInterval(()=>{index++;render();if(index>=count-1)stop()},900)};render();
</script>
