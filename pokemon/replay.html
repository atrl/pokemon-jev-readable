<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Pokémon · Jev 运行回放</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11141b;color:#e9edf4;font:15px/1.6 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:36px 24px}header{margin-bottom:22px}h1{font-size:30px;margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}.muted{color:#a9b5c9}#warning{border-left:3px solid #e4b963;padding:10px 16px;background:#29261f;margin:18px 0}#metrics{display:flex;flex-wrap:wrap;gap:16px;margin:20px 0}.metric{background:#1c222e;padding:12px 18px;border-radius:10px}.metric strong{display:block;font-size:24px}.grid{display:grid;grid-template-columns:minmax(300px,1.1fr) 1fr;gap:22px}.panel{background:#1a202b;border:1px solid #2c3544;border-radius:14px;padding:20px}#screen{display:block;width:100%;max-width:480px;aspect-ratio:10/9;object-fit:contain;image-rendering:pixelated;margin:auto;background:#090b10}#controls{display:flex;align-items:center;gap:8px;margin-top:18px}button{background:#313d51;border:1px solid #44516a;border-radius:8px;color:#fff;padding:8px 15px;cursor:pointer}button:disabled{opacity:.4;cursor:default}input{width:100%;margin:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111722;padding:12px;border-radius:8px;font-size:13px}#text{min-height:70px}#counter{margin-left:auto}.bar{display:grid;grid-template-columns:66px 1fr 55px;align-items:center;gap:10px;margin:5px 0}.track{background:#2b3444;border-radius:4px;overflow:hidden;height:11px}.fill{background:#8ca6ce;height:100%}.selected .fill{background:#83d4b1}details{margin-top:14px}summary{cursor:pointer}#raw{max-height:350px;overflow:auto}.status{display:inline-block;border:1px solid #46536c;padding:3px 10px;border-radius:20px}footer{margin-top:25px;color:#a9b5c9}@media(max-width:780px){.grid{grid-template-columns:1fr}main{padding:20px 14px}h1{font-size:24px}}
</style>
<main>
<header><div class="muted">REAL TRACE / READ-ONLY REPLAY</div><h1>Pokémon × Jev 运行回放</h1><div id="status" class="status"></div><p class="muted">展示真实运行记录。每步截图回放，不是实时直播；模型置信度不等于任务成功率。</p><div id="source" class="muted"></div></header>
<div id="metrics"></div><div id="warning" hidden></div>
<div class="grid"><section class="panel"><h2 id="frame-title">决策前画面</h2><img id="screen" alt="本步骤真实模拟器截图"><div id="no-screen" hidden>本次运行没有截图。请查看停止原因。</div><div id="controls"><button id="prev">上一步</button><button id="play">播放</button><button id="next">下一步</button><span id="counter"></span></div><input id="slider" type="range" min="0" value="0" aria-label="选择回放步骤"><p class="muted">最后一帧是执行完全部已记录动作后的实际画面。</p></section>
<section class="panel"><h2 id="action"></h2><div id="latency" class="muted"></div><pre id="position"></pre><h2>候选按键概率</h2><div id="probabilities"></div><h2 style="margin-top:20px">内存解码的屏幕文字</h2><pre id="text"></pre><details><summary>执行后的坐标与文字</summary><pre id="after"></pre></details><details><summary>完整模型请求（不含密钥）</summary><pre id="raw"></pre></details></section></div>
<footer>没有截图不代表没有执行；没有坐标变化也可能处在菜单或对话。本页面不会调用模型或修改游戏状态。</footer>
</main>
<script id="trace" type="application/json">__REPLAY_DATA__</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById("trace").textContent), steps=data.steps, s=data.summary;
const $=id=>document.getElementById(id);let index=0,timer=null;
const statusNames={budget_reached:"达到决策预算，已停止（非通关）",failed:"运行失败",blocked_missing_key:"未配置密钥，未执行 Jev",not_run:"Jev 未运行：本次可能只执行了回归测试",interrupted:"用户中断"};
$("status").textContent=statusNames[s.status]||s.status;$("source").textContent=s.source_run||"本地运行记录";
for(const [label,value] of [["Jev 调用",s.reported_jev_calls],["执行动作",s.reported_executed_actions],["坐标变化",s.position_changes],["不同位置",s.distinct_positions]]){const box=document.createElement("div");box.className="metric";const strong=document.createElement("strong");strong.textContent=value;box.append(strong,document.createTextNode(label));$("metrics").append(box)}
const message=[s.warning,s.reason].filter(Boolean).join(" ");if(message){$("warning").hidden=false;$("warning").textContent=message}
const count=steps.length+(data.last_image?1:0);$("slider").max=Math.max(0,count-1);$("slider").disabled=count<2;
function fmt(p){return p?`地图 ${p.map_id} · (${p.x}, ${p.y})`:"未读取到位置"}
function render(){const row=steps[index],last=!row;$("frame-title").textContent=last?"最终画面":"决策前画面";const image=last?data.last_image:row.image;$("screen").hidden=!image;$("no-screen").hidden=!!image;if(image)$("screen").src=image;$("counter").textContent=count?`${index+1} / ${count}`:"0 / 0";$("slider").value=index;$("prev").disabled=index<=0;$("next").disabled=index>=count-1;$("play").disabled=count<2;$("action").textContent=last?"本次运行结束":`步骤 ${row.step+1} · ${String(row.button).toUpperCase()}`;$("latency").textContent=last?"任务完成状态：未独立验证":`${row.model||"未知模型"} · 模型请求 ${row.latency_ms??"?"} ms · ${row.executed?"已执行":"未确认执行"}`;$("position").textContent=fmt(last?s.end_position:row.before);$("text").textContent=(last?data.last_text:row.text_before).join("\n")||"（没有可解码文字；不等于空白画面）";$("after").textContent=last?"":fmt(row.after)+"\n"+row.text_after.join("\n");$("raw").textContent=last?JSON.stringify(s,null,2):JSON.stringify(row.request,null,2);$("probabilities").replaceChildren();if(row)for(const [key,value] of Object.entries(row.probabilities).sort((a,b)=>b[1]-a[1])){const el=document.createElement("div");el.className="bar"+(key===row.button?" selected":"");const label=document.createElement("span");label.textContent=key;const track=document.createElement("div");track.className="track";const fill=document.createElement("div");fill.className="fill";fill.style.width=(100*Math.max(0,Math.min(1,Number(value))))+"%";track.append(fill);const number=document.createElement("span");number.textContent=(100*value).toFixed(1)+"%";el.append(label,track,number);$("probabilities").append(el)}}
function stop(){clearInterval(timer);timer=null;$("play").textContent="播放"}
$("prev").onclick=()=>{stop();index=Math.max(0,index-1);render()};$("next").onclick=()=>{stop();index=Math.min(count-1,index+1);render()};$("slider").oninput=e=>{stop();index=Number(e.target.value);render()};$("play").onclick=()=>{if(timer){stop();return}if(index>=count-1)index=0;render();$("play").textContent="暂停";timer=setInterval(()=>{index++;render();if(index>=count-1)stop()},900)};render();
</script>
</html>
